<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Container Principal do Jogo (Viewport) */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 120px;
            background-color: #1a1a1a;
            overflow: hidden;
            cursor: grab;
        }

        #game-container:active {
            cursor: grabbing;
        }

        /* O Mundo que será arrastado e escalonado */
        #world {
            position: absolute;
            transform-origin: 0 0;
        }

        /* Camadas do Mapa */
        #fundo-layer, #mapa-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* HUD Inferior */
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, #3a3a3a, #1e1e1e);
            border-top: 3px solid #555;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
        }

        /* Controles (Canto Inferior Esquerdo) */
        #map-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            background: #222;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            min-width: 150px;
        }

        /* Miniatura Interativa no HUD */
        #minimap-container {
            position: relative;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Espaça as setas para as bordas */
            overflow: hidden;
            transition: transform 0.1s;
        }

        #minimap-container:active {
            transform: scale(0.98);
        }

        /* Setas Indicativas na Miniatura */
        .minimap-arrow {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 0 8px;
            font-size: 18px;
            font-weight: bold;
            display: none; /* Controlado via JS */
            height: 100%;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Deixa o clique passar para o minimapa */
        }
        
        #arrow-left {
            border-right: 1px solid #555;
        }

        #arrow-right {
            border-left: 1px solid #555;
            margin-left: auto; /* Empurra para a direita */
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
    </div>

    <!-- HUD apenas com Select e a Miniatura Interativa -->
    <div id="hud">
        <div id="map-controls">
            <select id="map-list" onchange="changeMap(this.value)">
                <option value="" disabled selected>Carregando mapas...</option>
            </select>

            <!-- A Miniatura agora é o botão de troca de lado -->
            <div id="minimap-container" title="Clique para trocar de lado" onclick="toggleSide()">
                <div id="arrow-left" class="minimap-arrow">&#9664;</div>
                <div id="arrow-right" class="minimap-arrow">&#9654;</div>
            </div>
        </div>
    </div>

    <script>
        let mapData = [];
        let currentMapIndex = 0;
        let currentSide = 'A'; // 'A' ou 'B'
        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Elementos DOM
        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const mapList = document.getElementById('map-list');
        const arrowLeft = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');

        // Inicialização
        async function init() {
            try {
                const response = await fetch('mapas/mapas.json');
                const data = await response.json();
                mapData = data.mapas;

                mapList.innerHTML = '';
                mapData.forEach((mapa, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = mapa.nome;
                    mapList.appendChild(option);
                });

                if (mapData.length > 0) {
                    loadMap();
                }

                window.addEventListener('resize', () => {
                    if (mapData.length > 0) {
                        calculateScale();
                        updateTransform();
                    }
                });

                setupPanGestures();
                setupSwipeToChangeSide(); // Mantém a opção de swipe na miniatura além do clique

            } catch (error) {
                console.error("Erro ao carregar mapas/mapas.json:", error);
                mapList.innerHTML = '<option>Erro ao carregar mapas</option>';
            }
        }

        function changeMap(index) {
            currentMapIndex = parseInt(index);
            loadMap();
        }

        function toggleSide() {
            if (mapData.length === 0) return;
            currentSide = currentSide === 'A' ? 'B' : 'A';
            updateMapVisuals();
        }

        function loadMap() {
            const map = mapData[currentMapIndex];
            
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            panX = 0;
            panY = 0; 

            updateMapVisuals();
            updateTransform();
        }

        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            
            let miniSrc = currentSide === 'A' ? (map.miniaturaA || map.miniatura) : (map.miniaturaB || map.miniatura);
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;

            // Lógica das setas: Lado A exibe seta para direita, Lado B exibe seta para a esquerda
            if (currentSide === 'A') {
                arrowLeft.style.display = 'none';
                arrowRight.style.display = 'flex';
            } else {
                arrowLeft.style.display = 'flex';
                arrowRight.style.display = 'none';
            }
        }

        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            scale = containerHeight / map.altura;
        }

        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            let minX = cw - scaledWidth;
            let maxX = 0;
            let minY = ch - scaledHeight;
            let maxY = 0;

            if (minX > 0) {
                minX = minX / 2;
