<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Container Principal do Jogo (Viewport) */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 120px;
            background-color: #1a1a1a;
            overflow: hidden;
            cursor: grab;
        }

        #game-container:active {
            cursor: grabbing;
        }

        /* O Mundo que será arrastado e escalonado */
        #world {
            position: absolute;
            transform-origin: 0 0;
        }

        /* Camada de Fundo */
        #fundo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Camada do Mapa Principal (Lado A ou B) */
        #mapa-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Miniatura (Minimapa) */
        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 100;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: ew-resize;
        }

        /* HUD Inferior */
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, #3a3a3a, #1e1e1e);
            border-top: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Mantém os itens à esquerda */
            padding: 0 20px;
            z-index: 200;
        }

        /* Bloco Único de Controles no Canto Inferior Esquerdo */
        #map-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            background: #222;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            min-width: 150px;
        }

        /* Seletor de Lados */
        #side-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: pan-y;
            cursor: ew-resize;
            border-left: 1px solid #666;
            padding-left: 15px;
        }

        .side-btn {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .side-btn:hover, .side-btn:active {
            background: #666;
        }

        #current-side-label {
            font-size: 16px;
            font-weight: bold;
            width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
        
        <div id="minimap-container" title="Arraste para os lados para trocar A/B"></div>
    </div>

    <!-- O HUD agora possui apenas 1 bloco inferior esquerdo com os dois controles -->
    <div id="hud">
        <div id="map-controls">
            <select id="map-list" onchange="changeMap(this.value)">
                <option value="" disabled selected>Carregando mapas...</option>
            </select>

            <div id="side-selector">
                <button class="side-btn" onclick="toggleSide()">&#9664;</button>
                <span id="current-side-label">Lado A</span>
                <button class="side-btn" onclick="toggleSide()">&#9654;</button>
            </div>
        </div>
    </div>

    <script>
        let mapData = [];
        let currentMapIndex = 0;
        let currentSide = 'A'; // 'A' ou 'B'
        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Elementos DOM
        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const mapList = document.getElementById('map-list');
        const sideLabel = document.getElementById('current-side-label');

        // Inicialização com Fetch
        async function init() {
            try {
                const response = await fetch('mapas/mapas.json');
                const data = await response.json();
                mapData = data.mapas;

                // Limpa o select e preenche com os mapas reais
                mapList.innerHTML = '';
                mapData.forEach((mapa, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = mapa.nome;
                    mapList.appendChild(option);
                });

                if (mapData.length > 0) {
                    loadMap();
                }

                // Eventos
                window.addEventListener('resize', () => {
                    if (mapData.length > 0) {
                        calculateScale();
                        updateTransform();
                    }
                });

                setupPanGestures();
                setupSwipeToChangeSide();

            } catch (error) {
                console.error("Erro ao carregar mapas/mapas.json:", error);
                mapList.innerHTML = '<option>Erro ao carregar mapas</option>';
                alert("Não foi possível carregar os mapas. Você está rodando em um servidor local (ex: Live Server)?");
            }
        }

        function changeMap(index) {
            currentMapIndex = parseInt(index);
            loadMap();
        }

        function toggleSide() {
            if (mapData.length === 0) return;
            currentSide = currentSide === 'A' ? 'B' : 'A';
            sideLabel.textContent = `Lado ${currentSide}`;
            updateMapVisuals();
        }

        function loadMap() {
            const map = mapData[currentMapIndex];
            
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            panX = 0;
            panY = 0; 

            updateMapVisuals();
            updateTransform();
        }

        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            
            // Assume que se miniaturaA não existir, busca 'miniatura', senão fica vazio
            let miniSrc = currentSide === 'A' ? (map.miniaturaA || map.miniatura) : (map.miniaturaB || map.miniatura);
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;
        }

        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            scale = containerHeight / map.altura;
        }

        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            let minX = cw - scaledWidth;
            let maxX = 0;
            let minY = ch - scaledHeight;
            let maxY = 0;

            if (minX > 0) {
                minX = minX / 2;
                maxX = minX; 
            }
            if (minY > 0) {
                minY = minY / 2;
                maxY = minY;
            }

            panX = Math.max(minX, Math.min(maxX, panX));
            panY = Math.max(minY, Math.min(maxY, panY));

            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function setupPanGestures() {
            let isDragging = false;
            let startX, startY, startPanX, startPanY;

            function onPointerDown(e) {
                if (e.target.closest('#hud') || e.target.closest('#minimap-container')) return; 
                isDragging = true;
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                startPanX = panX;
                startPanY = panY;
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const dx = currentX - startX;
                const dy = currentY - startY;

                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }

            function onPointerUp() {
                isDragging = false;
            }

            gameContainer.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            gameContainer.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        function setupSwipeToChangeSide() {
            let swipeStartX = 0;
            const sideSelector = document.getElementById('side-selector');

            const targets = [sideSelector, minimap];

            targets.forEach(target => {
                target.addEventListener('mousedown', (e) => swipeStartX = e.clientX);
                target.addEventListener('mouseup', (e) => handleSwipe(swipeStartX, e.clientX));
                
                target.addEventListener('touchstart', (e) => swipeStartX = e.touches[0].clientX, {passive: true});
                target.addEventListener('touchend', (e) => handleSwipe(swipeStartX, e.changedTouches[0].clientX));
            });

            function handleSwipe(start, end) {
                const diff = end - start;
                if (Math.abs(diff) > 40) { 
                    toggleSide();
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
