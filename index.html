<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Container do Mapa -->
    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
    </div>

    <!-- O HUD VAI SER INJETADO AQUI -->
    <div id="hud-container"></div>

    <!-- Carrega o módulo do HUD -->
    <script src="hud.js"></script>

    <!-- Lógica Principal do Mapa -->
    <script>
        // Objeto global para facilitar comunicação entre scripts
        window.GameApp = {
            mapData: [],
            currentMapIndex: 0,
            currentSide: 'A',
            scale: 1, panX: 0, panY: 0,

            init: async function() {
                // Manda o HUD construir a interface na tela
                GunboundHUD.render('hud-container');

                try {
                    const response = await fetch('mapas/mapas.json?v=' + new Date().getTime());
                    if (!response.ok) throw new Error(`Erro ${response.status}`);

                    const data = await response.json();
                    this.mapData = data.mapas;

                    this.buildVisualMapList();

                    if (this.mapData.length > 0) {
                        this.loadMap();
                    }

                    window.addEventListener('resize', () => {
                        if (this.mapData.length > 0) {
                            this.calculateScale();
                            this.updateTransform();
                        }
                    });

                    this.setupPanGestures();

                    // Fechar lista suspensa ao clicar fora
                    document.addEventListener('mousedown', (e) => {
                        const visualMapList = document.getElementById('visual-map-list');
                        if (visualMapList && !e.target.closest('#map-controls') && visualMapList.style.display === 'grid') {
                            visualMapList.style.display = 'none';
                        }
                    });

                } catch (error) {
                    console.error("Erro ao carregar mapas:", error);
                }
            },

            buildVisualMapList: function() {
                const visualMapList = document.getElementById('visual-map-list');
                if(!visualMapList) return;
                
                visualMapList.innerHTML = '';
                this.mapData.forEach((mapa, index) => {
                    const card = document.createElement('div');
                    card.className = 'map-item-card';
                    card.onclick = () => this.selectMap(index);

                    const preview = document.createElement('div');
                    preview.className = 'map-item-preview';
                    let previewSrc = mapa.miniaturaA || mapa.miniatura;
                    preview.style.backgroundImage = `url('${previewSrc}')`;

                    const nameLabel = document.createElement('div');
                    nameLabel.className = 'map-item-name';
                    nameLabel.textContent = mapa.nome;

                    card.appendChild(preview);
                    card.appendChild(nameLabel);
                    visualMapList.appendChild(card);
                });
            },

            toggleMapList: function() {
                const visualMapList = document.getElementById('visual-map-list');
                if(visualMapList) {
                    visualMapList.style.display = visualMapList.style.display === 'grid' ? 'none' : 'grid';
                }
            },

            selectMap: function(index) {
                this.currentMapIndex = index;
                this.currentSide = 'A'; 
                document.getElementById('visual-map-list').style.display = 'none';
                this.loadMap();
            },

            toggleSide: function(clickedSide) {
                if (this.mapData.length === 0) return;
                if (this.currentSide === 'A' && clickedSide === 'right') this.currentSide = 'B';
                else if (this.currentSide === 'B' && clickedSide === 'left') this.currentSide = 'A';
                this.updateMapVisuals();
            },

            loadMap: function() {
                const map = this.mapData[this.currentMapIndex];
                const world = document.getElementById('world');
                const minimap = document.getElementById('minimap-container');
                const fundoLayer = document.getElementById('fundo-layer');
                
                world.style.width = map.largura + 'px';
                world.style.height = map.altura + 'px';
                minimap.style.width = map.miniaturaLargura + 'px';
                minimap.style.height = map.miniaturaAltura + 'px';
                fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

                this.calculateScale();
                this.panX = 0; this.panY = 0; 
                this.updateMapVisuals();
                this.updateTransform();
            },

            updateMapVisuals: function() {
                const map = this.mapData[this.currentMapIndex];
                const imgSrc = this.currentSide === 'A' ? map.ladoA : map.ladoB;
                let miniSrc = this.currentSide === 'A' ? (map.miniaturaA || map.miniatura) : (map.miniaturaB || map.miniatura);
                
                document.getElementById('mapa-layer').style.backgroundImage = `url('${imgSrc}')`;
                document.getElementById('minimap-container').style.backgroundImage = `url('${miniSrc}')`;

                const clickLeft = document.getElementById('click-left');
                const clickRight = document.getElementById('click-right');
                const arrowIndicator = document.getElementById('arrow-indicator');

                if (this.currentSide === 'A') {
                    arrowIndicator.className = 'arrow-right';
                    clickLeft.style.display = 'none';  
                    clickRight.style.display = 'block'; 
                } else {
                    arrowIndicator.className = 'arrow-left';
                    clickLeft.style.display = 'block'; 
                    clickRight.style.display = 'none'; 
                }
            },

            calculateScale: function() {
                const map = this.mapData[this.currentMapIndex];
                const gameContainer = document.getElementById('game-container');
                this.scale = gameContainer.clientHeight / map.altura;
            },

            updateTransform: function() {
                const map = this.mapData[this.currentMapIndex];
                const gameContainer = document.getElementById('game-container');
                const cw = gameContainer.clientWidth;
                const ch = gameContainer.clientHeight;

                const scaledWidth = map.largura * this.scale;
                const scaledHeight = map.altura * this.scale;

                let minX = cw - scaledWidth, maxX = 0;
                let minY = ch - scaledHeight, maxY = 0;

                if (minX > 0) { minX = minX / 2; maxX = minX; }
                if (minY > 0) { minY = minY / 2; maxY = minY; }

                this.panX = Math.max(minX, Math.min(maxX, this.panX));
                this.panY = Math.max(minY, Math.min(maxY, this.panY));
                
                document.getElementById('world').style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
            },

            setupPanGestures: function() {
                let isDragging = false;
                let startX, startY, startPanX, startPanY;
                const gameContainer = document.getElementById('game-container');

                const onPointerDown = (e) => {
                    if (e.target.closest('#hud-wrapper')) return; 
                    isDragging = true;
                    startX = e.clientX || (e.touches && e.touches[0].clientX);
                    startY = e.clientY || (e.touches && e.touches[0].clientY);
                    startPanX = this.panX;
                    startPanY = this.panY;
                };

                const onPointerMove = (e) => {
                    if (!isDragging) return;
                    const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                    const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                    this.panX = startPanX + (currentX - startX);
                    this.panY = startPanY + (currentY - startY);
                    this.updateTransform();
                };

                const onPointerUp = () => { isDragging = false; };

                gameContainer.addEventListener('mousedown', onPointerDown);
                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('mouseup', onPointerUp);
                
                gameContainer.addEventListener('touchstart', onPointerDown, {passive: false});
                window.addEventListener('touchmove', onPointerMove, {passive: false});
                window.addEventListener('touchend', onPointerUp);
            }
        };

        // Inicia tudo quando a página carrega
        window.onload = () => window.GameApp.init();
    </script>
</body>
</html>
