<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para mobile: previne zoom e travamento de escala -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;700&display=swap');

        /* Removemos comportamentos padrão que atrapalham o "arrastar" em mobile/desktop */
        body {
            font-family: 'Inter', sans-serif;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; /* Previne scroll nativo no mobile para usarmos os pointer events */
            background-color: #000;
        }

        .font-retro {
            font-family: 'VT323', monospace;
        }

        /* Fallbacks visuais (sem textos, apenas uma malha/cor para debug caso imagens falhem) */
        .fallback-fundo {
            background-color: #0f172a;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .fallback-mapa {
            background-color: transparent;
            background-image: linear-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        /* Classes utilitárias do cursor da Câmera */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing !important; }

        /* Estilo do select (combobox) customizado pro estilo retrô/escuro */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<!-- Usamos h-[100dvh] que respeita a barra de navegação real dos celulares -->
<body class="w-screen h-[100dvh] overflow-hidden flex flex-col">

    <main id="viewport-container" class="flex-1 relative overflow-hidden bg-gray-950 cursor-grab w-full">
        
        <!-- Câmera controlada via Transformação 2D (Translação e Escala) -->
        <div id="camera" class="absolute top-0 left-0 origin-top-left will-change-transform">
            
            <!-- Container do Mapa (Tamanho Fixo: Ex: 1800x1800) -->
            <div id="map-container" class="relative">
                
                <!-- Camada de Fundo -->
                <div id="layer-fundo" class="absolute bg-no-repeat bg-center bg-cover fallback-fundo shadow-2xl"></div>

                <!-- Camada do Terreno Principal (Lado A ou B) -->
                <div id="layer-mapa" class="absolute inset-0 bg-no-repeat bg-center bg-contain fallback-mapa pointer-events-none"></div>
                
            </div>
            
        </div>
        
    </main>

    <footer class="h-[120px] shrink-0 bg-gradient-to-b from-gray-800 to-gray-950 border-t-[3px] border-gray-600 shadow-[0_-5px_15px_rgba(0,0,0,0.8)] relative z-50 flex items-center px-4 md:px-8 justify-between">
        
        <!-- Esquerda: Seletor de Lado -->
        <div class="flex flex-col gap-1 z-10 w-32">
            <label for="side-selector" class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Lado do Mapa</label>
            <div class="relative">
                <select id="side-selector" class="w-full bg-gray-900 border border-gray-600 text-amber-500 font-bold py-2 pl-3 pr-8 rounded focus:outline-none focus:border-amber-500 shadow-inner cursor-pointer transition-colors hover:bg-gray-800">
                    <option value="A">Lado A</option>
                    <option value="B">Lado B</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>
        </div>

        <!-- Centro: Placeholder Barra de Força / Ângulo / Vento -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            
            <div class="bg-gray-900/80 border border-gray-700/80 rounded-xl p-3 flex flex-col gap-2 items-center w-[250px] md:w-[400px] shadow-lg backdrop-blur-sm">
                
                <!-- Info Superior do HUD central -->
                <div class="w-full flex justify-between px-2 text-[10px] text-gray-500 font-bold uppercase">
                    <span class="flex items-center gap-1"><div class="w-2 h-2 bg-blue-500 rounded-full"></div> Ang: 45°</span>
                    <span class="flex items-center gap-1 text-green-400"><div class="w-2 h-2 bg-green-500 rounded-full"></div> Vento: 12</span>
                </div>

                <!-- Barra de Força Mockada -->
                <div class="w-full h-4 bg-gray-950 rounded-full overflow-hidden border border-gray-800 relative">
                    <div class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400 w-1/3"></div>
                    <!-- Marcadores da barra -->
                    <div class="absolute inset-0 flex justify-between px-[10%]">
                        <div class="w-px h-full bg-gray-500/50"></div>
                        <div class="w-px h-full bg-gray-500/50"></div>
                        <div class="w-px h-full bg-gray-500/50"></div>
                    </div>
                </div>

                <div class="text-[10px] text-gray-600 font-retro tracking-widest">PLACEHOLDER UI</div>
            </div>

        </div>
        
        <!-- Direita: Reservado para Itens (Slot vazio p/ manter alinhamento) -->
        <div class="w-32"></div>
        
    </footer>

    <script>
        // Dados do JSON de entrada
        const mapData = {
            "mapas": [
                {
                    "id": "adiumroot",
                    "nome": "Adiumroot",
                    "ladoA": "mapas/Adiumroot A.webp",
                    "ladoB": "mapas/Adiumroot B.webp",
                    "fundo": "mapas/Adiumroot Fundo.webp",
                    "miniatura": "mapas/Adiumroot Mini.webp",
                    "largura": 1800,
                    "altura": 1800,
                    "fundoLargura": 1300,
                    "fundoAltura": 1300,
                    "miniaturaLargura": 211,
                    "miniaturaAltura": 47
                }
            ]
        };

        const currentMap = mapData.mapas[0];

        // Elementos DOM
        const viewport = document.getElementById('viewport-container');
        const camera = document.getElementById('camera');
        const mapContainer = document.getElementById('map-container');
        const layerFundo = document.getElementById('layer-fundo');
        const layerMapa = document.getElementById('layer-mapa');
        const sideSelector = document.getElementById('side-selector');

        // Estado da Câmera
        let cameraScale = 1;
        let cameraX = 0;
        let cameraY = 0;

        // Estado de Interação
        let isDragging = false;
        let startPointerX = 0;
        let startPointerY = 0;
        let initialCameraX = 0;
        let initialCameraY = 0;

        function initMap() {
            // Configura o tamanho base (raw) do mapa
            mapContainer.style.width = `${currentMap.largura}px`;
            mapContainer.style.height = `${currentMap.altura}px`;

            // Configura a camada de Fundo (Centralizando-a em relação ao mapa de 1800x1800)
            layerFundo.style.width = `${currentMap.fundoLargura}px`;
            layerFundo.style.height = `${currentMap.fundoAltura}px`;
            layerFundo.style.left = `${(currentMap.largura - currentMap.fundoLargura) / 2}px`;
            layerFundo.style.top = `${(currentMap.altura - currentMap.fundoAltura) / 2}px`;
            layerFundo.style.backgroundImage = `url('${currentMap.fundo}')`;

            // O mapa de terreno ocupa todo o container (1800x1800)
            updateSideImage();

            // Realiza o primeiro cálculo de escala e limites
            recalculateViewport();
            
            // Inicia com a câmera centralizada no mapa
            centerCamera();
        }

        function updateSideImage() {
            const side = sideSelector.value;
            layerMapa.style.backgroundImage = `url('${side === 'A' ? currentMap.ladoA : currentMap.ladoB}')`;
        }

        function recalculateViewport() {
            const viewportWidth = viewport.clientWidth;
            const viewportHeight = viewport.clientHeight;

            // Escala baseada na altura para que os 1800px caibam exatamente na altura do viewport
            cameraScale = viewportHeight / currentMap.altura;
            
            // Aplica clamp após re-escalar
            clampCamera();
            renderCamera();
        }

        function clampCamera() {
            const viewportWidth = viewport.clientWidth;
            const viewportHeight = viewport.clientHeight;

            const scaledMapWidth = currentMap.largura * cameraScale;
            const scaledMapHeight = currentMap.altura * cameraScale;

            // Limites Horizontais (X)
            let minX, maxX;
            if (scaledMapWidth > viewportWidth) {
                // Mapa é mais largo que a tela: podemos arrastar para a esquerda
                minX = viewportWidth - scaledMapWidth;
                maxX = 0;
            } else {
                // Mapa é menor ou igual à tela: travamos ele centralizado
                minX = (viewportWidth - scaledMapWidth) / 2;
                maxX = minX;
            }

            // Limites Verticais (Y)
            let minY, maxY;
            if (scaledMapHeight > viewportHeight) {
                // Mapa mais alto que a tela (raro neste setup pois travamos a altura)
                minY = viewportHeight - scaledMapHeight;
                maxY = 0;
            } else {
                // Como a escala é baseada na altura, normalmente cairá aqui, perfeitamente travado (min == max)
                minY = (viewportHeight - scaledMapHeight) / 2;
                maxY = minY;
            }

            // Aplica os limites rígidos
            if (cameraX < minX) cameraX = minX;
            if (cameraX > maxX) cameraX = maxX;
            if (cameraY < minY) cameraY = minY;
            if (cameraY > maxY) cameraY = maxY;
        }

        function centerCamera() {
            const viewportWidth = viewport.clientWidth;
            const scaledMapWidth = currentMap.largura * cameraScale;
            
            // Começa no centro do eixo X
            cameraX = (viewportWidth - scaledMapWidth) / 2;
            clampCamera();
            renderCamera();
        }

        function renderCamera() {
            // Aplicamos a translação EM PIXELS DE TELA e depois escalamos o container usando a origem no topo esquerdo (0,0)
            camera.style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${cameraScale})`;
        }

        viewport.addEventListener('pointerdown', (e) => {
            isDragging = true;
            viewport.classList.add('cursor-grabbing');
            viewport.setPointerCapture(e.pointerId);

            startPointerX = e.clientX;
            startPointerY = e.clientY;
            initialCameraX = cameraX;
            initialCameraY = cameraY;
        });

        viewport.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            // Calcula a distância movida
            const deltaX = e.clientX - startPointerX;
            const deltaY = e.clientY - startPointerY;

            // Atualiza posição alvo
            cameraX = initialCameraX + deltaX;
            cameraY = initialCameraY + deltaY;

            clampCamera();
            renderCamera();
        });

        const endDrag = (e) => {
            isDragging = false;
            viewport.classList.remove('cursor-grabbing');
            if (e && e.pointerId) viewport.releasePointerCapture(e.pointerId);
        };

        viewport.addEventListener('pointerup', endDrag);
        viewport.addEventListener('pointercancel', endDrag);

        // Eventos de UI
        sideSelector.addEventListener('change', updateSideImage);
        window.addEventListener('resize', recalculateViewport);

        // Iniciar
        window.onload = initMap;
    </script>
</body>
</html>
