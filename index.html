<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <!-- Vinculando o CSS Externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
    </div>

    <div id="hud">
        <div id="map-controls">
            <div id="visual-map-list"></div>

            <div id="minimap-container">
                <div class="click-zone-side" id="click-left" onclick="toggleSide('left')" title="Lado B"></div>
                <div class="click-zone-center" onclick="toggleMapList()" title="Trocar Mapa"></div>
                <div class="click-zone-side" id="click-right" onclick="toggleSide('right')" title="Lado A"></div>
                <div id="arrow-indicator" class="arrow-right"></div>
            </div>
        </div>
    </div>

    <script>
        let mapData = [];
        let currentMapIndex = 0;
        let currentSide = 'A'; 
        let scale = 1;
        let panX = 0;
        let panY = 0;

        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const visualMapList = document.getElementById('visual-map-list');
        const arrowIndicator = document.getElementById('arrow-indicator');

        async function init() {
            try {
                const response = await fetch('mapas/mapas.json?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Erro ${response.status}`);
                }

                const data = await response.json();
                mapData = data.mapas;

                buildVisualMapList();

                if (mapData.length > 0) {
                    loadMap();
                }

                window.addEventListener('resize', () => {
                    if (mapData.length > 0) {
                        calculateScale();
                        updateTransform();
                    }
                });

                setupPanGestures();

                document.addEventListener('mousedown', (e) => {
                    if (!e.target.closest('#map-controls') && visualMapList.style.display === 'grid') {
                        visualMapList.style.display = 'none';
                    }
                });

            } catch (error) {
                console.error("Erro ao carregar mapas:", error);
                alert("Falha ao ler mapas/mapas.json.");
            }
        }

        function buildVisualMapList() {
            visualMapList.innerHTML = '';
            mapData.forEach((mapa, index) => {
                const card = document.createElement('div');
                card.className = 'map-item-card';
                card.onclick = () => selectMap(index);

                const preview = document.createElement('div');
                preview.className = 'map-item-preview';
                
                let previewSrc = mapa.miniaturaA || mapa.miniatura;
                preview.style.backgroundImage = `url('${previewSrc}')`;

                const nameLabel = document.createElement('div');
                nameLabel.className = 'map-item-name';
                nameLabel.textContent = mapa.nome;

                card.appendChild(preview);
                card.appendChild(nameLabel);
                visualMapList.appendChild(card);
            });
        }

        function toggleMapList() {
            if (visualMapList.style.display === 'grid') {
                visualMapList.style.display = 'none';
            } else {
                visualMapList.style.display = 'grid';
            }
        }

        function selectMap(index) {
            currentMapIndex = index;
            currentSide = 'A'; 
            visualMapList.style.display = 'none';
            loadMap();
        }

        function toggleSide(clickedSide) {
            if (mapData.length === 0) return;
            
            if (currentSide === 'A' && clickedSide === 'right') {
                currentSide = 'B';
                updateMapVisuals();
            } else if (currentSide === 'B' && clickedSide === 'left') {
                currentSide = 'A';
                updateMapVisuals();
            }
        }

        function loadMap() {
            const map = mapData[currentMapIndex];
            
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            panX = 0;
            panY = 0; 

            updateMapVisuals();
            updateTransform();
        }

        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            
            let miniSrc = currentSide === 'A' ? (map.miniaturaA || map.miniatura) : (map.miniaturaB || map.miniatura);
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;

            const clickLeft = document.getElementById('click-left');
            const clickRight = document.getElementById('click-right');

            if (currentSide === 'A') {
                arrowIndicator.className = 'arrow-right';
                clickLeft.style.display = 'none';  
                clickRight.style.display = 'block'; 
            } else {
                arrowIndicator.className = 'arrow-left';
                clickLeft.style.display = 'block'; 
                clickRight.style.display = 'none'; 
            }
        }

        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            scale = containerHeight / map.altura;
        }

        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            let minX = cw - scaledWidth;
            let maxX = 0;
            let minY = ch - scaledHeight;
            let maxY = 0;

            if (minX > 0) {
                minX = minX / 2;
                maxX = minX; 
            }
            if (minY > 0) {
                minY = minY / 2;
                maxY = minY;
            }

            panX = Math.max(minX, Math.min(maxX, panX));
            panY = Math.max(minY, Math.min(maxY, panY));

            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function setupPanGestures() {
            let isDragging = false;
            let startX, startY, startPanX, startPanY;

            function onPointerDown(e) {
                if (e.target.closest('#hud')) return; 
                isDragging = true;
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                startPanX = panX;
                startPanY = panY;
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const dx = currentX - startX;
                const dy = currentY - startY;

                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }

            function onPointerUp() {
                isDragging = false;
            }

            gameContainer.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            gameContainer.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        window.onload = init;
    </script>
</body>
</html>
