<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b111e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Container Principal do Jogo (Viewport) */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 80px; 
            background-color: #0b111e;
            overflow: hidden;
            cursor: grab;
        }

        #game-container:active {
            cursor: grabbing;
        }

        /* O Mundo que será arrastado e escalonado */
        #world {
            position: absolute;
            transform-origin: 0 0;
        }

        /* Camadas do Mapa */
        #fundo-layer, #mapa-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* HUD Inferior - Estilo Gunbound */
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: #11151e;
            border-top: 1px solid #000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05);
        }

        /* Caixa Escura que envelopa o minimapa */
        #map-controls {
            display: flex;
            align-items: center;
            background: #0d1117;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #06080b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            position: relative; /* Para ancorar o menu suspenso */
        }

        /* Miniatura Interativa Principal (O controle em si) */
        #minimap-container {
            position: relative;
            background-color: #000;
            border: 2px solid #3a4354;
            border-radius: 4px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            min-width: 200px;
            min-height: 47px; /* Altura padrão com base no seu json inicial */
            display: flex;
            overflow: hidden;
        }

        /* Zonas de clique Invisíveis */
        .click-zone-side {
            width: 30px;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        .click-zone-center {
            flex-grow: 1;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        /* Seta Laranja (Triângulo CSS) - Mantido igual ao anterior */
        #arrow-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-style: solid;
            pointer-events: none; 
            filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.8)); 
            z-index: 5;
        }

        .arrow-right {
            right: 6px;
            border-width: 6px 0 6px 8px;
            border-color: transparent transparent transparent #ffaa00; 
        }

        .arrow-left {
            left: 6px;
            border-width: 6px 8px 6px 0;
            border-color: transparent #ffaa00 transparent transparent;
        }

        /* ------------------------------------- */
        /* Menu Suspenso Visual (Grade de Mapas) */
        /* ------------------------------------- */
        #visual-map-list {
            position: absolute;
            bottom: 100%; /* Sobe a partir da caixa */
            left: 0;
            margin-bottom: 10px;
            background: rgba(17, 21, 30, 0.95);
            border: 1px solid #3a4354;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
            display: none; /* Escondido por padrão */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            width: max-content;
            max-width: 80vw;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 300;
            backdrop-filter: blur(5px);
        }

        /* Como o scrollbar no Windows pode ficar feio */
        #visual-map-list::-webkit-scrollbar {
            width: 8px;
        }
        #visual-map-list::-webkit-scrollbar-thumb {
            background: #3a4354;
            border-radius: 4px;
        }

        .map-item-card {
            background: #000;
            border: 2px solid #2b3240;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .map-item-card:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 170, 0, 0.2);
        }

        .map-item-preview {
            width: 100%;
            height: 40px; /* Altura fixa para preview na lista */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border-bottom: 1px solid #2b3240;
        }

        .map-item-name {
            padding: 5px;
            font-size: 12px;
            color: #ccc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
    </div>

    <div id="hud">
        <div id="map-controls">
            <!-- Menu Visual que sobe ao clicar no meio da miniatura -->
            <div id="visual-map-list"></div>

            <!-- Miniatura Central, agora sem o Select em texto -->
            <div id="minimap-container">
                <!-- Zonas de clique para lado ou lista -->
                <div class="click-zone-side" id="click-left" onclick="toggleSide('left')" title="Lado B"></div>
                <div class="click-zone-center" onclick="toggleMapList()" title="Trocar Mapa"></div>
                <div class="click-zone-side" id="click-right" onclick="toggleSide('right')" title="Lado A"></div>
                
                <!-- Seta Laranja CSS -->
                <div id="arrow-indicator" class="arrow-right"></div>
            </div>
        </div>
    </div>

    <script>
        let mapData = [];
        let currentMapIndex = 0;
        let currentSide = 'A'; // 'A' ou 'B'
        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Elementos DOM
        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const visualMapList = document.getElementById('visual-map-list');
        const arrowIndicator = document.getElementById('arrow-indicator');

        // Inicialização
        async function init() {
            try {
                const response = await fetch('mapas/mapas.json?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Erro ${response.status}`);
                }

                const data = await response.json();
                mapData = data.mapas;

                buildVisualMapList();

                if (mapData.length > 0) {
                    loadMap();
                }

                window.addEventListener('resize', () => {
                    if (mapData.length > 0) {
                        calculateScale();
                        updateTransform();
                    }
                });

                setupPanGestures();

                // Fechar lista se clicar fora
                document.addEventListener('mousedown', (e) => {
                    if (!e.target.closest('#map-controls') && visualMapList.style.display === 'grid') {
                        visualMapList.style.display = 'none';
                    }
                });

            } catch (error) {
                console.error("Erro ao carregar mapas:", error);
                alert("Falha ao ler mapas/mapas.json.");
            }
        }

        // Constrói a lista visual (Grade)
        function buildVisualMapList() {
            visualMapList.innerHTML = '';
            mapData.forEach((mapa, index) => {
                const card = document.createElement('div');
                card.className = 'map-item-card';
                card.onclick = () => selectMap(index);

                const preview = document.createElement('div');
                preview.className = 'map-item-preview';
                
                // Usa a miniatura padrão (ou miniaturaA) para o preview da lista
                let previewSrc = mapa.miniaturaA || mapa.miniatura;
                preview.style.backgroundImage = `url('${previewSrc}')`;

                const nameLabel = document.createElement('div');
                nameLabel.className = 'map-item-name';
                nameLabel.textContent = mapa.nome;

                card.appendChild(preview);
                card.appendChild(nameLabel);
                visualMapList.appendChild(card);
            });
        }

        // Abre/Fecha a lista de mapas
        function toggleMapList() {
            if (visualMapList.style.display === 'grid') {
                visualMapList.style.display = 'none';
            } else {
                visualMapList.style.display = 'grid';
            }
        }

        // Seleciona um mapa a partir da lista
        function selectMap(index) {
            currentMapIndex = index;
            currentSide = 'A'; // Força resetar para o lado A ao trocar
            visualMapList.style.display = 'none';
            loadMap();
        }

        // Lógica de clique nas pontas
        function toggleSide(clickedSide) {
            if (mapData.length === 0) return;
            
            // Se estou no lado A e a seta está na direita, clico na direita para ir pro lado B.
            // Se estou no lado B e a seta está na esquerda, clico na esquerda para voltar pro lado A.
            
            if (currentSide === 'A' && clickedSide === 'right') {
                currentSide = 'B';
                updateMapVisuals();
            } else if (currentSide === 'B' && clickedSide === 'left') {
                currentSide = 'A';
                updateMapVisuals();
            }
        }

        function loadMap() {
            const map = mapData[currentMapIndex];
            
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            panX = 0;
            panY = 0; 

            updateMapVisuals();
            updateTransform();
        }

        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            
            let miniSrc = currentSide === 'A' ? (map.miniaturaA || map.miniatura) : (map.miniaturaB || map.miniatura);
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;

            // Lógica visual da seta e display das zonas de clique
            const clickLeft = document.getElementById('click-left');
            const clickRight = document.getElementById('click-right');

            if (currentSide === 'A') {
                arrowIndicator.className = 'arrow-right';
                clickLeft.style.display = 'none';  // Desativa zona de clique esquerda
                clickRight.style.display = 'block'; // Ativa zona de clique direita
            } else {
                arrowIndicator.className = 'arrow-left';
                clickLeft.style.display = 'block'; // Ativa zona esquerda
                clickRight.style.display = 'none'; // Desativa zona direita
            }
        }

        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            scale = containerHeight / map.altura;
        }

        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            let minX = cw - scaledWidth;
            let maxX = 0;
            let minY = ch - scaledHeight;
            let maxY = 0;

            if (minX > 0) {
                minX = minX / 2;
                maxX = minX; 
            }
            if (minY > 0) {
                minY = minY / 2;
                maxY = minY;
            }

            panX = Math.max(minX, Math.min(maxX, panX));
            panY = Math.max(minY, Math.min(maxY, panY));

            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // Sistema de Panning via Pointer Events
        function setupPanGestures() {
            let isDragging = false;
            let startX, startY, startPanX, startPanY;

            function onPointerDown(e) {
                if (e.target.closest('#hud')) return; 
                isDragging = true;
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                startPanX = panX;
                startPanY = panY;
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const dx = currentX - startX;
                const dy = currentY - startY;

                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }

            function onPointerUp() {
                isDragging = false;
            }

            gameContainer.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            gameContainer.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        window.onload = init;
    </script>
</body>
</html>
