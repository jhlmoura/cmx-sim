<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Impede scroll de página indesejado */
            touch-action: none; /* Desativa gestos nativos do mobile (ex: pull-to-refresh) */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 120px; /* Deixa exatos 120px livres para o HUD */
            background-color: #0f172a; /* Cor de fundo escura caso mapa não cubra tudo */
            overflow: hidden;
            cursor: grab;
        }

        #game-container:active {
            cursor: grabbing;
        }

        #world {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #fundo-layer, #mapa-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%; /* Força o fundo a preencher a área toda */
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Cor de fallback para visualizar o tamanho caso as imagens falhem no github */
        #fundo-layer { background-color: rgba(30, 41, 59, 0.8); }
        #mapa-layer { background-color: rgba(76, 175, 80, 0.1); border: 1px dashed rgba(255,255,255,0.2); }

        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, #334155, #0f172a);
            border-top: 3px solid #475569;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        #map-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        select {
            padding: 10px 12px;
            font-size: 16px;
            font-weight: bold;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            min-width: 160px;
        }

        #minimap-container {
            position: relative;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #64748b;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s;
        }

        #minimap-container:hover {
            border-color: #94a3b8;
        }

        #minimap-container:active {
            transform: scale(0.96);
        }

        .minimap-arrow {
            background: rgba(0, 0, 0, 0.7);
            color: #fbbf24; /* Amarelo Gunbound */
            padding: 0 10px;
            font-size: 20px;
            display: none; /* Modificado via JS */
            height: 100%;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Deixa o clique vazar para o minimapa pai */
        }
        
        #arrow-left { border-right: 1px solid #475569; }
        #arrow-right { border-left: 1px solid #475569; margin-left: auto; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
    </div>

    <div id="hud">
        <div id="map-controls">
            <!-- Select de Mapas -->
            <select id="map-list" onchange="changeMap(this.value)"></select>

            <!-- Minimapa que atua como Seletor de Lado -->
            <div id="minimap-container" title="Clique ou Arraste para alternar os Lados A/B">
                <div id="arrow-left" class="minimap-arrow">&#9664;</div>
                <div id="arrow-right" class="minimap-arrow">&#9654;</div>
            </div>
        </div>
    </div>

    <script>
        // DICA: Para evitar erros de carregamento no GitHub, os dados estão embutidos aqui.
        // Se no futuro quiser voltar para o fetch, basta substituir esta constante.
        const HARDCODED_MAP_DATA = {
            "mapas": [
                {
                    "id": "adiumroot",
                    "nome": "Adiumroot",
                    "ladoA": "mapas/Adiumroot A.webp",
                    "ladoB": "mapas/Adiumroot B.webp",
                    "fundo": "mapas/Adiumroot Fundo.webp",
                    "miniaturaA": "mapas/Adiumroot Mini.webp", // Ajuste no seu json original se a miniatura mudar de lado
                    "miniaturaB": "mapas/Adiumroot Mini.webp",
                    "largura": 1800,
                    "altura": 1800,
                    "fundoLargura": 1300,
                    "fundoAltura": 1300,
                    "miniaturaLargura": 211,
                    "miniaturaAltura": 47
                }
            ]
        };

        let mapData = HARDCODED_MAP_DATA.mapas;
        let currentMapIndex = 0;
        let currentSide = 'A'; // 'A' ou 'B'
        
        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Referências DOM
        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const mapList = document.getElementById('map-list');
        const arrowLeft = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');

        function init() {
            // Preenche o Select
            mapList.innerHTML = '';
            mapData.forEach((mapa, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = mapa.nome;
                mapList.appendChild(option);
            });

            if (mapData.length > 0) {
                loadMap();
            }

            // Recalcula o tamanho se o usuário girar o celular ou redimensionar a janela
            window.addEventListener('resize', () => {
                if (mapData.length > 0) {
                    calculateScale();
                    updateTransform();
                }
            });

            setupPanGestures();
            setupMinimapInteraction();
        }

        function changeMap(index) {
            currentMapIndex = parseInt(index);
            loadMap();
        }

        function loadMap() {
            const map = mapData[currentMapIndex];
            
            // Define dimensões reais
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            // Fundo fixo para os dois lados
            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            centerCamera();

            updateMapVisuals();
            updateTransform();
        }

        function toggleSide() {
            if (mapData.length === 0) return;
            currentSide = currentSide === 'A' ? 'B' : 'A';
            updateMapVisuals();
        }

        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            
            // Imagens Principais
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            const miniSrc = currentSide === 'A' ? map.miniaturaA : map.miniaturaB;
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;

            // Lógica das setas indicativas (mostra a direção do Lado OPOSTO)
            if (currentSide === 'A') {
                // Estamos no Lado A, mostre seta para a direita indicando que ali está o B
                arrowLeft.style.display = 'none';
                arrowRight.style.display = 'flex';
            } else {
                // Estamos no Lado B, mostre seta para a esquerda indicando que ali está o A
                arrowLeft.style.display = 'flex';
                arrowRight.style.display = 'none';
            }
        }

        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            // A altura do mapa escalado será igual a altura do container (100% de fit vertical)
            scale = containerHeight / map.altura;
        }

        function centerCamera() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const scaledWidth = map.largura * scale;
            
            // Centraliza no eixo X por padrão
            panX = (cw - scaledWidth) / 2;
            panY = 0; // Travado na altura
        }

        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            // Calcula limites (Clamp)
            let minX = cw - scaledWidth;
            let maxX = 0;
            let minY = ch - scaledHeight;
            let maxY = 0;

            // Se o mapa for menor que a tela, forçamos ele a ficar no centro
            if (minX > 0) {
                minX = minX / 2;
                maxX = minX; 
            }
            if (minY > 0) {
                minY = minY / 2;
                maxY = minY;
            }

            panX = Math.max(minX, Math.min(maxX, panX));
            panY = Math.max(minY, Math.min(maxY, panY));

            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function setupPanGestures() {
            let isDragging = false;
            let startX, startY, startPanX, startPanY;

            // Usando Pointer Events para abranger tanto Mouse quanto Touch (Mobile) nativamente
            gameContainer.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startPanX = panX;
                startPanY = panY;
                gameContainer.setPointerCapture(e.pointerId);
            });

            gameContainer.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            });

            const onPointerUp = (e) => {
                isDragging = false;
                if (e.pointerId) gameContainer.releasePointerCapture(e.pointerId);
            };

            gameContainer.addEventListener('pointerup', onPointerUp);
            gameContainer.addEventListener('pointercancel', onPointerUp);
        }

        function setupMinimapInteraction() {
            let swipeStartX = 0;
            let isSwiping = false;

            // Suporte a Mouse e Touch para interagir com o minimapa
            minimap.addEventListener('pointerdown', (e) => {
                swipeStartX = e.clientX;
                isSwiping = false; // Reset na flag
            });

            minimap.addEventListener('pointermove', (e) => {
                if (e.buttons > 0) { // Se estiver com o dedo/mouse pressionado arrastando
                    const diff = e.clientX - swipeStartX;
                    if (Math.abs(diff) > 20) isSwiping = true;
                }
            });

            minimap.addEventListener('pointerup', (e) => {
                const diff = e.clientX - swipeStartX;
                
                // Se foi um arraste claro ou um clique normal, alternamos o lado
                if (Math.abs(diff) > 30 || !isSwiping) {
                    toggleSide();
                }
            });
        }

        // Dispara a inicialização ao concluir carregamento da janela
        window.onload = init;
    </script>
</body>
</html>
