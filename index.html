<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunbound Web Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Impede rolagem nativa */
            touch-action: none; /* Previne gestos de recarregar a página no mobile */
        }

        /* Container Principal do Jogo (Viewport) */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 120px; /* Espaço do HUD */
            background-color: #1a1a1a;
            overflow: hidden;
            cursor: grab;
        }

        #game-container:active {
            cursor: grabbing;
        }

        /* O Mundo que será arrastado e escalonado */
        #world {
            position: absolute;
            transform-origin: 0 0;
            /* Um leve outline para debugar limites se a imagem falhar */
            outline: 1px dashed rgba(255, 255, 255, 0.2); 
        }

        /* Camada de Fundo (Preenche todo o mapa) */
        #fundo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%; /* Força preencher todo o tamanho do mapa */
            background-repeat: no-repeat;
            background-position: center;
            background-color: #2a3d45; /* Cor fallback */
        }

        /* Camada do Mapa Principal (Lado A ou B) */
        #mapa-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: rgba(76, 175, 80, 0.1); /* Cor fallback translúcida */
        }

        /* Miniatura (Minimapa) */
        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 100;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            /* Fallback de visualização se não tiver imagem */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
            cursor: ew-resize; /* Indica que pode arrastar para os lados */
        }

        /* HUD Inferior */
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, #3a3a3a, #1e1e1e);
            border-top: 3px solid #555;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
        }

        /* Controles do Mapa no Canto Inferior Esquerdo */
        #map-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            background: #222;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        /* Seletor de Lados */
        #side-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: pan-y; /* Permite swipe horizontal via JS */
            cursor: ew-resize;
        }

        .side-btn {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .side-btn:hover, .side-btn:active {
            background: #666;
        }

        #current-side-label {
            font-size: 16px;
            font-weight: bold;
            width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="world">
            <div id="fundo-layer"></div>
            <div id="mapa-layer"></div>
        </div>
        
        <div id="minimap-container" title="Arraste para os lados para trocar A/B">
            <span id="minimap-fallback-text">Minimapa</span>
        </div>
    </div>

    <div id="hud">
        <div id="map-controls">
            <!-- Lista de Mapas -->
            <select id="map-list" onchange="changeMap(this.value)"></select>

            <!-- Seletor de Lados -->
            <div id="side-selector">
                <button class="side-btn" onclick="toggleSide()">&#9664;</button>
                <span id="current-side-label">Lado A</span>
                <button class="side-btn" onclick="toggleSide()">&#9654;</button>
            </div>
        </div>
    </div>

    <script>
        // Mock do seu arquivo mapas/mapas.json com a estrutura atualizada
        const jsonMock = {
            "mapas": [
                {
                    "id": "adiumroot",
                    "nome": "Adiumroot",
                    "ladoA": "mapas/Adiumroot A.webp",
                    "ladoB": "mapas/Adiumroot B.webp",
                    "fundo": "mapas/Adiumroot Fundo.webp",
                    "miniaturaA": "mapas/Adiumroot Mini A.webp",
                    "miniaturaB": "mapas/Adiumroot Mini B.webp",
                    "largura": 1800,
                    "altura": 1800,
                    "fundoLargura": 1300,
                    "fundoAltura": 1300,
                    "miniaturaLargura": 211,
                    "miniaturaAltura": 47
                },
                {
                    "id": "metamine",
                    "nome": "Metamine (Teste)",
                    "ladoA": "mapas/Metamine A.webp",
                    "ladoB": "mapas/Metamine B.webp",
                    "fundo": "mapas/Metamine Fundo.webp",
                    "miniaturaA": "mapas/Metamine Mini A.webp",
                    "miniaturaB": "mapas/Metamine Mini B.webp",
                    "largura": 2400,
                    "altura": 1200,
                    "fundoLargura": 1000,
                    "fundoAltura": 800,
                    "miniaturaLargura": 250,
                    "miniaturaAltura": 40
                }
            ]
        };

        const mapData = jsonMock.mapas;
        let currentMapIndex = 0;
        let currentSide = 'A'; // 'A' ou 'B'

        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Elementos DOM
        const gameContainer = document.getElementById('game-container');
        const world = document.getElementById('world');
        const fundoLayer = document.getElementById('fundo-layer');
        const mapaLayer = document.getElementById('mapa-layer');
        const minimap = document.getElementById('minimap-container');
        const mapList = document.getElementById('map-list');
        const sideLabel = document.getElementById('current-side-label');

        // Inicialização
        function init() {
            // Preencher select list
            mapData.forEach((mapa, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = mapa.nome;
                mapList.appendChild(option);
            });

            loadMap();
            
            // Adicionar eventos de resize
            window.addEventListener('resize', () => {
                calculateScale();
                updateTransform();
            });

            setupPanGestures();
            setupSwipeToChangeSide();
        }

        // Troca de Mapa pela Lista
        function changeMap(index) {
            currentMapIndex = index;
            loadMap();
        }

        // Troca de Lado (A/B)
        function toggleSide() {
            currentSide = currentSide === 'A' ? 'B' : 'A';
            sideLabel.textContent = `Lado ${currentSide}`;
            updateMapVisuals();
        }

        // Carrega as dimensões e imagens
        function loadMap() {
            const map = mapData[currentMapIndex];
            
            // Define dimensões reais do mundo
            world.style.width = map.largura + 'px';
            world.style.height = map.altura + 'px';

            // Define dimensões do minimapa
            minimap.style.width = map.miniaturaLargura + 'px';
            minimap.style.height = map.miniaturaAltura + 'px';

            // Fundo principal
            fundoLayer.style.backgroundImage = `url('${map.fundo}')`;

            calculateScale();
            // Resetar posição ao carregar um novo mapa
            panX = 0;
            panY = 0; 

            updateMapVisuals();
            updateTransform();
        }

        // Atualiza apenas as imagens que dependem do lado (A ou B)
        function updateMapVisuals() {
            const map = mapData[currentMapIndex];
            const imgSrc = currentSide === 'A' ? map.ladoA : map.ladoB;
            const miniSrc = currentSide === 'A' ? map.miniaturaA : map.miniaturaB;
            
            mapaLayer.style.backgroundImage = `url('${imgSrc}')`;
            minimap.style.backgroundImage = `url('${miniSrc}')`;
            
            // Lógica simples para sumir com o texto de fallback caso a imagem falhe
            document.getElementById('minimap-fallback-text').style.display = 'none';
        }

        // Calcula a proporção Responsiva
        function calculateScale() {
            const map = mapData[currentMapIndex];
            const containerHeight = gameContainer.clientHeight;
            
            // Escalonar baseado na altura para jogos estilo Gunbound
            scale = containerHeight / map.altura;
        }

        // Aplica o Panning (Arraste) no Mundo com limites (Clamp)
        function updateTransform() {
            const map = mapData[currentMapIndex];
            const cw = gameContainer.clientWidth;
            const ch = gameContainer.clientHeight;

            // Calcula limites baseados no tamanho do mapa após escala
            const scaledWidth = map.largura * scale;
            const scaledHeight = map.altura * scale;

            let minX = cw - scaledWidth;
            let maxX = 0;

            let minY = ch - scaledHeight;
            let maxY = 0;

            // Se o mapa (escalonado) for menor que a tela, centraliza
            if (minX > 0) {
                minX = minX / 2;
                maxX = minX; // trava no meio
            }
            if (minY > 0) {
                minY = minY / 2;
                maxY = minY;
            }

            // Aplicar limites
            panX = Math.max(minX, Math.min(maxX, panX));
            panY = Math.max(minY, Math.min(maxY, panY));

            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // --- SISTEMA DE GESTOS (Mover Mapa) ---
        function setupPanGestures() {
            let isDragging = false;
            let startX, startY, startPanX, startPanY;

            function onPointerDown(e) {
                // Ignorar se clicar em algo do HUD
                if (e.target.closest('#hud') || e.target.closest('#minimap-container')) return; 
                
                isDragging = true;
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                startPanX = panX;
                startPanY = panY;
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const dx = currentX - startX;
                const dy = currentY - startY;

                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }

            function onPointerUp() {
                isDragging = false;
            }

            gameContainer.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            gameContainer.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        // --- SISTEMA DE GESTOS (Arrastar/Swipe para trocar o Lado) ---
        function setupSwipeToChangeSide() {
            let swipeStartX = 0;
            const sideSelector = document.getElementById('side-selector');

            // Aplica a lógica tanto ao painel de lado quanto ao minimapa
            const targets = [sideSelector, minimap];

            targets.forEach(target => {
                target.addEventListener('mousedown', (e) => swipeStartX = e.clientX);
                target.addEventListener('mouseup', (e) => handleSwipe(swipeStartX, e.clientX));
                
                target.addEventListener('touchstart', (e) => swipeStartX = e.touches[0].clientX, {passive: true});
                target.addEventListener('touchend', (e) => handleSwipe(swipeStartX, e.changedTouches[0].clientX));
            });

            function handleSwipe(start, end) {
                const diff = end - start;
                if (Math.abs(diff) > 40) { // Tolerância de 40px para considerar arrasto
                    toggleSide();
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
